services:
  git:
    image: codeberg.org/forgejo/forgejo:13.0.3
    container_name: git_ui
    mem_limit: 4g
    memswap_limit: 4g
    cpus: "2.0"
    restart: always
    depends_on:
      - git_db
    ports:
      - "8000:3000"
      - "127.0.0.1:2222:22"
    environment:
      USER_UID: 1000
      USER_GID: 1000
      DB_TYPE: postgres
      DB_HOST: git_db
      DB_NAME: git
      DB_USER: git
      DB_PASSWD: ${DB_PASSWD}
      APP_NAME: git
      FORGEJO__APP__DEFAULT_LANG: en-US
      FORGEJO__I18N__LANGS: en-US
      FORGEJO__I18N__NAMES: English
      FORGEJO__ACTIONS__ENABLED: "true"
    volumes:
      - git_data:/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  runner:
    image: code.forgejo.org/forgejo/runner:6.2.2
    container_name: git_runner
    user: "0:0"
    mem_limit: 1g
    cpus: "2.0"
    restart: always
    depends_on:
      git:
        condition: service_healthy
    environment:
      GITEA_INSTANCE_URL: http://git:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_REGISTRATION_TOKEN}
      GITEA_RUNNER_NAME: ${GITEA_RUNNER_NAME:-git-runner}
      GITEA_RUNNER_LABELS: ${GITEA_RUNNER_LABELS:-docker:docker://node:22-bookworm}
    volumes:
      - runner_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /data
    command:
      - /bin/sh
      - -c
      - |
        if [ ! -f /data/.runner ]; then
          forgejo-runner register \
            --no-interactive \
            --instance "$$GITEA_INSTANCE_URL" \
            --token "$$GITEA_RUNNER_REGISTRATION_TOKEN" \
            --name "$$GITEA_RUNNER_NAME" \
            --labels "$$GITEA_RUNNER_LABELS"
        fi
        exec forgejo-runner daemon

  git_db:
    image: postgres:18
    container_name: git_db
    mem_limit: 1g
    cpus: "2.0"
    restart: always
    environment:
      POSTGRES_USER: git
      POSTGRES_PASSWORD: ${DB_PASSWD}
      POSTGRES_DB: git
    volumes:
      - git_db_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U git"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  git_db_data:
  git_data:
  runner_data:
